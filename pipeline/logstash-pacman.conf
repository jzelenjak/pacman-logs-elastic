# Configuration file for processing Pacman (Arch Linux package manager) logs.
# - https://gitlab.archlinux.org/pacman/pacman/
# For more information about the used filter plugins, see the filter plugins documentation:
# - https://www.elastic.co/docs/reference/logstash/plugins/filter-plugins
# For more information about the Elastic Common Schema (ECS), see the ECS reference:
# - https://www.elastic.co/docs/reference/ecs/ecs-field-reference
# - https://www.elastic.co/docs/reference/ecs/ecs-category-field-values-reference
# For example Logstash configurations, see the Logstash documentation:
# - https://www.elastic.co/docs/reference/logstash/config-examples
# - https://www.elastic.co/docs/reference/logstash/event-dependent-configuration
# For grok patterns (ECS version 1), see:
# - https://github.com/logstash-plugins/logstash-patterns-core/blob/main/patterns/ecs-v1/grok-patterns

input {
    file {
        path => "/usr/share/logstash/ingest-data/*"
        start_position => "beginning"
        sincedb_path => "/dev/null"
    }
}

filter {
    # INFO: Drop lines like "filesystem: 750  package: 755"
    if [message] =~ /^filesystem: [0-9]+  package: [0-9]+$/ { drop {} }
    # INFO: Drop commented lines (can be useful during development)
    # if [message] =~ /^#/ { drop {} }
    # INFO: Change the host name to a more descriptive name (default is the container ID hash)
    # In addition, set common ECS fields to default values and change the timestamp to the event creation time
    mutate {
        replace => {
            "[host][name]" => "archlinux"
            "[event][original]" => "%{message}"
        }
        add_field => {
            "[event][created]" => "%{@timestamp}"
            "[event][category]" => "package"
            "[event][kind]" => "event"
            "[log][level]" => "default"
        }
    }
    # INFO: Extract event timestamp, provider (prefix, e.g. PACMAN, ALPM, ALPM-SCRIPTLET), and log action
    dissect {
        mapping => {"message" => "[%{timestamp}] [%{[event][provider]}] %{log_action}"}
    }
    mutate {
        replace => {"message" => "%{log_action}"}
        remove_field => "log_action"
    }
    # NOTE: Alternatively, you can use grok instead of dissect and mutate
    #grok {
    #    match => {"message" => "\[%{TIMESTAMP_ISO8601:timestamp}\]%{SPACE}\[%{PROG:[event][provider]}\]%{SPACE}%{GREEDYDATA:message}"}
    #    overwrite => ["message"]
    #}
    # INFO: Set event timestamp
    date {
        match => ["timestamp", "ISO8601"]
        target => "@timestamp"
        remove_field => "timestamp"
    }
    # INFO: Below is the parsing of three pacman prefixes: PACMAN, ALPM, and ALPM-SCRIPTLET
    # ==========================
    # INFO: Handle PACMAN prefix
    # ==========================
    if [event][provider] == "PACMAN" {
        if [message] =~ /^[Rr]unning/ {
            grok {
                match => {"message" => "[Rr]unning '%{GREEDYDATA:[process][command_line]}'"}
            }
            mutate {
                replace => {
                    "[event][action]" => "pacman-command"
                    "[event][type]" => "start"
                }
                add_field => {"[event][category]" => "process"}
            }
            if [process][command_line] {
                ruby {
                    init => 'require "shellwords"'
                    code => '
                        argv = Shellwords.shellsplit(event.get("[process][command_line]"))
                        event.set("[process][args]", argv)
                        event.set("[process][name]", argv[0])
                        event.set("[process][args_count]", argv.length)
                    '
                }
            }
        } else if [message] =~ /^[Ss]ynchronizing/ {
            mutate {
                replace => {
                    "[event][action]" => "package-database-sync"
                    "[event][type]" => "info"
                }
            }
        } else if [message] =~ /^[Ss]tarting( full)? system upgrade/ {
            mutate {
                replace => {
                    "[event][action]" => "system-upgrade-started"
                    "[event][type]" => "start"
                }
            }
        } 
    }
    # ========================
    # INFO: Handle ALPM prefix
    # ========================
    if [event][provider] == "ALPM" {
        # INFO: Handle ALPM package actions (start with "installed", "reinstalled", "upgraded", "downgraded", "removed")
        if [message] =~ /^((re)?install(ed)?|(up|down)grade(d)?|remove(d)?)/ {
            grok {
                # NOTE: previous_version is not an ECS field
                match => {"message" => [
                    "%{WORD:[event][action]}%{SPACE}%{PROG:[package][name]}%{SPACE}\(%{DATA:[package][previous_version]}%{SPACE}->%{SPACE}%{DATA:[package][version]}\)",
                    "%{WORD:[event][action]}%{SPACE}%{PROG:[package][name]}%{SPACE}\(%{DATA:[package][version]}\)"
                    ]}
            }
            mutate { replace => {"[event][action]" => "package-%{[event][action]}"} }
            translate {
                source => "[event][action]"
                target => "[event][type]"
                regex => true
                dictionary => {
                    "(re)?install" => "installation"
                    "(up|down)grade" => "change"
                    "remove" => "deletion"
                }
            }
        # INFO: Handle ALPM log transaction actions (start with "transaction", e.g. "transaction started", "transaction completed")
        } else if [message] =~ /^transaction (started|completed|failed|interrupted)$/ {
            mutate {
                replace => {"[event][action]" => "%{message}"}
                gsub => ["[event][action]", " ", "-"]
            }
            if [message] =~ /started/ {
                mutate { replace => {"[event][type]" => "start"} }
            } else if [message] =~ /completed/ {
                mutate {
                    replace => {
                        "[event][type]" => "end"
                        "[event][outcome]" => "success"
                    }
                }
            } else {
                mutate {
                    replace => {
                        "[event][type]" => "end"
                        "[event][outcome]" => "failure"
                    }
                }
            }
        # INFO: Handle ALPM log hook actions (start with "running", e.g. "running '20-systemd-sysusers.hook'...")
        } else if [message] =~ /^[Rr]unning.*\.\.\.$/ {
            grok {
                match => {"message" => "running%{SPACE}'%{PROG:[labels][hook_name]}'\.\.\."}
            }
            mutate {
                replace => {
                    "[labels][hook_type]" => "transaction"
                    "[event][category]" => "configuration"
                    "[event][action]" => "transaction-hook-started"
                    "[event][type]" => "start"
                }
            }
        # INFO: Handle ALPM log messages with non-default log level ("error: ...", "warning: ...", "debug: ", "function: ")
        # For log levels, see `src/pacman/util.c` and `lib/libalpm/alpm.h` in the pacman repository
        } else if [message] =~ /^(error|warning|debug|function):/ {
            grok {
                match => {"message" => "%{WORD:[log][level]}:%{SPACE}%{GREEDYDATA:message}"}
                overwrite => ["[log][level]", "message"]
            }
            mutate { replace => {"[event][action]" => "alpm-log-%{[log][level]}"} }
            if [log][level] == "error" {
                mutate { replace => {"[event][type]" => "error"}}
            } else {
                mutate { replace => {"[event][type]" => "info"}}
            }
        }
    }
    # ==================================
    # INFO: Handle ALPM-SCRIPTLET prefix
    # ==================================
    if [event][provider] == "ALPM-SCRIPTLET" {
        # INFO: Build hooks, e.g.: "  -> Running build hook: [base]"
        if [message] =~ /[Rr]unning build hook/ {
            grok {
                match => {"message" => "[Rr]unning build hook(:)?%{SPACE}\[%{PROG:[labels][hook_name]}\]"}
            }
            mutate {
                replace => {
                    "[labels][hook_type]" => "build"
                    "[event][category]" => "configuration"
                    "[event][action]" => "build-hook-started"
                    "[event][type]" => "start"
                }
            }
        # INFO: Warning or error messages, e.g.:
        # "==> WARNING: Possibly missing firmware for module: 'xhci_pci'"
        # "==> ERROR: Missing 6.12.4-arch1-1 kernel headers for module vboxhost/7.1.4_OSE."
        } else if [message] =~ /^(==> )?(WARNING|ERROR):/ {
            grok {
                match => {"message" => "(==> )?%{WORD:[log][level]}:%{SPACE}%{GREEDYDATA:message}"}
                overwrite => ["[log][level]", "message"]
            }
            mutate { lowercase => ["[log][level]"] }
            mutate {
                replace => {
                    "[event][action]" => "alpm-scriptlet-log-%{[log][level]}"
                    "[event][category]" => "configuration"
                }
            }
            if [log][level] == "error" {
                mutate { replace => {"[event][type]" => "error"} }
            } else {
                mutate { replace => {"[event][type]" => "info"} }
            }
        # INFO: Image build start, e.g.: "==> Building image from preset: /etc/mkinitcpio.d/linux-hardened.preset: 'default'"
        #        or kernel build start, e.g.: "==> Starting build: '6.5.5-hardened1-1-hardened'"
        } else if [message] =~ /^(==> )?Building image/ or [message] =~ /^(==> )?Starting build/ {
            grok {
                match => {"message" => [
                            "(==> )?Building image from preset: %{PATH:[labels][mkinitcpio_preset_file]}: '%{DATA:[labels][mkinitcpio_preset_name]}'",
                            "(==> )?Starting build: '%{PROG:[labels][kernel_build_version]}'"]}
            }
            mutate {
                replace => {
                    "[event][category]" => "configuration"
                    "[event][type]" => "start"
                }
            }
            if "Starting build" in [message] {
                mutate { replace => {"[event][action]" => "kernel-build-started"} }
            } else {
                mutate { replace => {"[event][action]" => "mkinitcpio-build-started"} }
            }
        # INFO: Running dkms or depmod commands, e.g.: "==> dkms install --no-depmod vboxhost/7.0.12_OSE -k 6.1.62-1-lts" or "==> depmod 6.1.62-1-lts"
        #        or running mkinitcpio: "  -> -k /boot/vmlinuz-linux-hardened -g /boot/initramfs-linux-hardened.img --microcode /boot/intel-ucode.img"
        } else if [message] =~ /^(==> )?(dkms|depmod)/ or [message] =~ /-k .*vmlinuz-linux/ {
            mutate {
                replace => {"[process][command_line]" => "%{message}"}
                gsub => ["[process][command_line]", "==>\s*", "", "[process][command_line]", "\s*->\s*", ""]
            }
            # INFO: Add the process name (mkinitcpio) to the lines with command-line options
            if [process][command_line] =~ /^-/ {
                mutate { replace => {"[process][command_line]" => "mkinitcpio %{[process][command_line]}"} }
            }
            ruby {
                init => 'require "shellwords"'
                code => '
                    argv = Shellwords.shellsplit(event.get("[process][command_line]"))
                    event.set("[process][args]", argv)
                    event.set("[process][name]", argv[0])
                    event.set("[process][args_count]", argv.length)
                    event.set("[event][type]", "start")
                    event.set("[event][action]", "#{argv[0]}-command")
                    event.set("[event][category]", ["configuration", "process"])
                '
            }
            # NOTE: Drop malformed pacman commands (should not happen with normal Pacman logs)
            if "_rubyexception" in [tags] { drop {} }
        # INFO: Creating users or groups, e.g.: "Creating user 'dbus' (System Message Bus) with UID 81 and GID 81." or "Creating group 'dbus' with GID 81."
        } else if [message] =~ /^Creating (user|group)/ {
            # NOTE: gid is not an ECS field
            grok {
                match => {"message" => [
                            "Creating %{WORD:[event][action]} '%{DATA:[user][name]}' \(%{DATA:[user][full_name]}\) with UID %{POSINT:[user][id]} and GID %{POSINT:[user][gid]}\.?",
                            "Creating %{WORD:[event][action]} '%{DATA:[group][name]}' with GID %{POSINT:[group][id]}\.?"]}
            }
            mutate {
                replace => {
                    "[event][action]" => "%{[event][action]}-created"
                    "[event][category]" => "iam"
                    "[event][type]" => "creation"
                }
            }
        # INFO: Creating symlinks, e.g.: "Created symlink /etc/systemd/user/sockets.target.wants/pipewire.socket → /usr/lib/systemd/user/pipewire.socket."
        } else if [message] =~ /^Created symlink/ {
            grok {
                match => {"message" => ["Created symlink %{PATH:[file][path]}%{DATA}%{PATH:[file][target_path]}\.",
                                        "Created symlink %{PATH:[file][path]}%{DATA}%{PATH:[file][target_path]}"]}
            }
            mutate {
                replace => {
                    "[event][category]" => "file"
                    "[event][action]" => "symlink-created"
                    "[event][type]" => "creation"
                }
            }
        } else {
        # INFO: Default case (treat as informational messages) 
            mutate {
                replace => {
                    "[event][category]" => "configuration"
                    "[event][action]" => "alpm-scriptlet-output"
                    "[event][type]" => "info"
                }
            }
        }
    }
    # INFO: Convert event.type and event.category fields into an array, as required by ECS
    ruby {
        code => '
            type = event.get("[event][type]")
            event.set("[event][type]", [type].flatten.uniq) if type
            category = event.get("[event][category]")
            event.set("[event][category]", [category].flatten.uniq) if category
        '
    }
    # Convert event.provider (prefix, e.g. PACMAN, ALPM, ALPM-SCRIPTLET) to lowercase
    mutate { lowercase => ["[event][provider]"] }
}

output {
    elasticsearch {
        hosts => "${ES_HOSTS}"
        user => "elastic"
        password => "${ELASTIC_PASSWORD}"
        ssl_enabled => true
        ssl_certificate_authorities => "${SSL_CERTIFICATE_AUTHORITIES}"
        data_stream => "true"
        data_stream_type => "logs"
        data_stream_dataset => "pacman"
        data_stream_namespace => "${DS_NAMESPACE:default}"
    }
    stdout {
        codec => rubydebug
    }
}
